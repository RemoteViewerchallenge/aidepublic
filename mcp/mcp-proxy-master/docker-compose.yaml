version: '3.8'

services:
  app:
    image: ghcr.io/tbxark/mcp-proxy:latest
    container_name: mcp-proxy-master-app-1
    ports:
      - "9090:9090"
    volumes:
      # Mount the local config and add the ':z' flag for SELinux compatibility
      - ./config.local.json:/config/config.json:ro,z
      # Mount the jungle directory to make adapters available to the proxy
      - ../jungle:/host:ro,z
    command: --config /config/config.json